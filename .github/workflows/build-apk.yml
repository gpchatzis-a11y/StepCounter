name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StepCounter.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepCounter-apk
          path: StepCounter.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: StepCounter v1.${{ github.run_number }}
          body: Κατέβασε το StepCounter.apk και άνοιξέ το στο κινητό για εγκατάσταση.
          files: StepCounter.apk
